{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"/>
    <link href="{% static "css/index.css" %}" rel=stylesheet/>
</head>
<body>

    <div class="container">
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
      <a href="{% url "news_index" %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
        <svg class="bi me-2" width="40" height="32"><use xlink:href="#bootstrap"></use></svg>
        <span class="fs-4">News</span>
      </a>
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="{% url "news_index" %}" class="nav-link active" aria-current="page">Home</a></li>
      </ul>
    </header>
    </div>
    {% comment %} Content {% endcomment %}
    <div class="container">
    {% block news_index %}{% endblock news_index %}   
    {% block category_page %}{% endblock category_page %}
    {% block current_news %}{% endblock current_news %}
    </div>

    <div class="container"> 
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"> 
            <p class="col-md-4 mb-0 text-body-secondary">© 2025 Company, Inc</p> 
            <a href="{% url "news_index" %}" class="link-dark">News</a>
        </footer>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
 
</body>
</html>
