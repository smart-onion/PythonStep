{% block discussion_card %}

<div class="card mb-4 shadow-sm" style="width: 22rem;">
  <!-- Optional image -->
  {# <img class="card-img-top" src="..." alt="Card image cap"> #}

  <div class="card-body d-flex flex-column">

    <!-- Title -->
    <h5 class="card-title mb-2">
      <i class="bi bi-chat-left-text me-2"></i>{{ discussion.subject }}
    </h5>

    <!-- Text -->
    <p class="card-text text-truncate" style="max-height: 4.5em; overflow: hidden;">
      {{ discussion.text }}
    </p>
    <p class="card-text text-truncate" style="max-height: 4.5em; overflow: hidden;">
    <a href={% url "author" author_id=discussion.author.id %} >Author: {{ discussion.author }}</a>

    </p>
    <!-- Stats with icons -->
    <div class="mb-3 d-flex gap-3">
      <span class="badge bg-danger">
        <a href="{% url 'discussion_like' %}?id={{ discussion.id }}&next={{request.path|urlencode}}" class="btn btn-sm">
                <i class="
                    {% if has_like %}
                    bi bi-hand-thumbs-up-fill
                    {% else %}
                    bi bi-hand-thumbs-up me-1
                    {% endif %}
                            
                "></i> {{ discussion.Likes }}
      </a>
      </span>

      <span class="badge bg-secondary">
        <a href="{% url 'discussion' discussion.id %}#comments" class="btn btn-sm">
        <i class="bi bi-chat-dots me-1"></i> {{ discussion.Comments }}
      </a>
      </span>
    </div>

    <!-- Buttons -->
    <div class="mt-auto d-flex flex-wrap gap-2">

      <!-- Read more button -->
      <a href="{% url 'discussion' discussion.id %}" class="btn btn-sm btn-outline-primary">
        <i class="bi bi-eye me-1"></i> Read more
      </a>

      <!-- Update button only for author -->
      {% if user == discussion.author %}
        <a href="{% url 'discussion_update' discussion.id %}" class="btn btn-sm btn-outline-warning">
          <i class="bi bi-pencil me-1"></i> Update
        </a>
      {% endif %}

    </div>
  </div>
</div>

{% endblock discussion_card %}
