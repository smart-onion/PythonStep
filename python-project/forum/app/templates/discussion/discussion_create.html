{% extends "_layout.html" %}

{% block discussion_create %}

<div class="container mt-4">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-light">
            <h4 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i> Create New Discussion
            </h4>
        </div>
        <div class="card-body">

            <form action="{% url 'discussion_create' %}" method="post">
                {% csrf_token %}

                <!-- Render form fields -->
                {% for field in form %}
                    <div class="mb-3">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i> Create
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock discussion_create %}
