{% extends "_layout.html" %}

{% block discussions %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <!-- Filter Form -->
    <form method="get" class="d-flex align-items-center">
        <label for="filter" class="me-2 mb-0 fw-bold">Sort by:</label>
        <select name="filter" id="filter" class="form-select form-select-sm me-2">
            <option value="likes" {% if request.GET.filter == "Likes" %}selected{% endif %}>Top Rated</option>
            <option value="comments" {% if request.GET.filter == "comment" %}selected{% endif %}>Top Discussed</option>
        </select>
        <button type="submit" class="btn btn-sm btn-primary">Set</button>
    </form>

    <!-- Add Discussion Button -->
    <a class="btn btn-success btn-sm" href="{% url 'discussion_create' %}">
        <i class="bi bi-plus-circle me-1"></i> Add Discussion
    </a>
</div>

<!-- Discussion Cards -->
<div class="row">
    {% for discussion in discussions %}
        <div class="col-md-6 col-lg-4 mb-4">
            {% include "discussion/discussion_card.html" with discussion=discussion %}
        </div>
    {% empty %}
        <p class="text-muted">No discussions yet.</p>
    {% endfor %}
</div>

{% endblock discussions %}
